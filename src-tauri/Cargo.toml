[package]
name = "icarus"
version = "0.3.17"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "icarus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde_json = "1.0.151"
amaru-bootstrap = { git = "https://github.com/pragma-org/amaru", branch = "main" }
amaru-node = { git = "https://github.com/pragma-org/amaru", branch = "main" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tauri-plugin-keep-screen-on = "0.1.4"
tauri-plugin-store = "2.4.4"
otel-ui-backend = { git = "https://github.com/jeluard/otel-ui", rev = "89ddd894ce4fed65b748aa9ed3ba3de59a3c749f" }

[target.'cfg(target_os = "ios")'.dependencies]
# UPLC decoding is recursive. iOS' default Rayon worker stack is too small for
# some on-chain scripts, so the application configures a larger pool at startup.
rayon = "1.11.0"

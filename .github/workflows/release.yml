name: Release

on:
  
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          TOOLCHAIN="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy --component rust-src
          rustup default "$TOOLCHAIN"
          rustup target add ${{ matrix.target }} --toolchain "$TOOLCHAIN"

      - name: Show Rust version
        run: |
          rustc --version
          if ! rustc --version | grep -q 'nightly'; then
            echo "rustc must be nightly for amaru (#![feature] dependency)"
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Package macOS app as tar.gz
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then
            echo "No .app bundle found in $BUNDLE_DIR"
            exit 1
          fi
          app_name="$(basename "$app")"
          base_name="${app_name%.app}"
          tar -C "$BUNDLE_DIR" -czf "$BUNDLE_DIR/$base_name.app.tar.gz" "$app_name"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
